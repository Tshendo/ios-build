name: s156 heap fengshui + metal tlb race
on: [push]
jobs:
  fengshui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
            -o HeapFengShui campaigns/s156_apple/heap_fengshui.c \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -framework CoreFoundation
          file HeapFengShui
          ls -la HeapFengShui
      - uses: actions/upload-artifact@v4
        with:
          name: heap-fengshui
          path: HeapFengShui

  cve28858:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
            -o CVE28858 campaigns/s156_apple/cve_28858_poc.c \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -framework CoreFoundation
          file CVE28858
      - uses: actions/upload-artifact@v4
        with:
          name: cve28858-poc
          path: CVE28858

  metal_race:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f campaigns/s156_apple/metal_tlb_race.m ]; then
            xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
              -o MetalTLBRace campaigns/s156_apple/metal_tlb_race.m \
              -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
              -framework CoreFoundation -framework Metal -framework IOSurface \
              -framework Foundation -fobjc-arc
            file MetalTLBRace
            ls -la MetalTLBRace
          else
            echo "metal_tlb_race.m not yet created, skipping"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-tlb-race
          path: MetalTLBRace
          if-no-files-found: ignore
