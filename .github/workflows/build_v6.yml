name: AllocatorProbe v11 signed
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AllocatorProbe v11 (arm64 iOS, WKWebView+scanner self-contained)
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 -fobjc-arc \
            -o AllocatorProbe_v11 campaigns/s159_apple/heap_fengshui_v11.m \
            -isysroot "$SDK" \
            -framework UIKit -framework WebKit -framework Foundation
          file AllocatorProbe_v11
          shasum -a 256 AllocatorProbe_v11
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v11_bin
          path: AllocatorProbe_v11

  sign-and-package:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AllocatorProbe_v11_bin
      - name: Import certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
      - name: Package and sign
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p AllocatorProbe_v11.app
          cp AllocatorProbe_v11 AllocatorProbe_v11.app/AllocatorProbe_v11
          chmod +x AllocatorProbe_v11.app/AllocatorProbe_v11
          cp signing/Info.plist AllocatorProbe_v11.app/Info.plist
          cp campaigns/s159_apple/agxfire_v11.html AllocatorProbe_v11.app/agxfire_v11.html
          echo "$MOBILEPROVISION_BASE64" | base64 -d > AllocatorProbe_v11.app/embedded.mobileprovision
          codesign -f -s "iPhone Developer: bestai.04.a@gmail.com (4B5SHD444M)" \
            --entitlements signing/entitlements.plist \
            AllocatorProbe_v11.app
          codesign --verify AllocatorProbe_v11.app && echo "Signature valid"
          mkdir -p Payload
          cp -r AllocatorProbe_v11.app Payload/
          zip -r AllocatorProbe_v11_signed.ipa Payload/
          ls -la AllocatorProbe_v11_signed.ipa
          echo "=== v11 ready: self-contained WKWebView+scanner, no Safari needed ==="
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v11_signed
          path: AllocatorProbe_v11_signed.ipa
