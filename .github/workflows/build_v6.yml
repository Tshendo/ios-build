name: AllocatorProbe v9 signed
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AllocatorProbe v9
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
            -o AllocatorProbe_v9 campaigns/s159_apple/heap_fengshui_v9.c \
            -isysroot "$SDK" -framework CoreFoundation
          file AllocatorProbe_v9
          shasum -a 256 AllocatorProbe_v9
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v9_bin
          path: AllocatorProbe_v9

  sign-and-package:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AllocatorProbe_v9_bin
      - name: Import certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
      - name: Package and sign
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p AllocatorProbe_v9.app
          cp AllocatorProbe_v9 AllocatorProbe_v9.app/AllocatorProbe_v9
          chmod +x AllocatorProbe_v9.app/AllocatorProbe_v9
          cp signing/Info.plist AllocatorProbe_v9.app/Info.plist
          echo "$MOBILEPROVISION_BASE64" | base64 -d > AllocatorProbe_v9.app/embedded.mobileprovision
          codesign -f -s "iPhone Developer: bestai.04.a@gmail.com (4B5SHD444M)" \
            --entitlements signing/entitlements.plist \
            AllocatorProbe_v9.app
          codesign --verify AllocatorProbe_v9.app && echo "Signature valid"
          mkdir -p Payload
          cp -r AllocatorProbe_v9.app Payload/
          zip -r AllocatorProbe_v9_signed.ipa Payload/
          ls -la AllocatorProbe_v9_signed.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v9_signed
          path: AllocatorProbe_v9_signed.ipa
