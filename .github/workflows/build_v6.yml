name: AllocatorProbe v8 signed
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AllocatorProbe v8
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
            -o AllocatorProbe_v8 campaigns/s159_apple/heap_fengshui_v8.c \
            -isysroot "$SDK" -framework CoreFoundation
          file AllocatorProbe_v8
          shasum -a 256 AllocatorProbe_v8
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v8_bin
          path: AllocatorProbe_v8

  sign-and-package:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AllocatorProbe_v8_bin
      - name: Import certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
      - name: Package and sign
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p AllocatorProbe_v8.app
          cp AllocatorProbe_v8 AllocatorProbe_v8.app/AllocatorProbe_v8
          chmod +x AllocatorProbe_v8.app/AllocatorProbe_v8
          sed 's/AllocatorProbe_v6/AllocatorProbe_v8/g; s/version.*6\.0.*/version\>8.0\<\/string\>/g' \
            signing/Info.plist > AllocatorProbe_v8.app/Info.plist
          echo "$MOBILEPROVISION_BASE64" | base64 -d > AllocatorProbe_v8.app/embedded.mobileprovision
          codesign -f -s "iPhone Developer: bestai.04.a@gmail.com (4B5SHD444M)" \
            --entitlements signing/entitlements.plist \
            AllocatorProbe_v8.app
          codesign --verify AllocatorProbe_v8.app && echo "Signature valid"
          mkdir -p Payload
          cp -r AllocatorProbe_v8.app Payload/
          zip -r AllocatorProbe_v8_signed.ipa Payload/
          ls -la AllocatorProbe_v8_signed.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v8_signed
          path: AllocatorProbe_v8_signed.ipa
