name: AllocatorProbe v14 signed
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AllocatorProbe v14 (ObjC WKWebView + mach port scanner)
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 -fobjc-arc \
            -o AllocatorProbe_v14 campaigns/s159_apple/heap_fengshui_v14.m \
            -isysroot "$SDK" \
            -framework UIKit -framework WebKit -framework Foundation
          file AllocatorProbe_v14
          shasum -a 256 AllocatorProbe_v14
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v14_bin
          path: AllocatorProbe_v14

  sign-and-package:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AllocatorProbe_v14_bin
      - name: Import certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
      - name: Package and sign
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p AllocatorProbe_v14.app
          cp AllocatorProbe_v14 AllocatorProbe_v14.app/AllocatorProbe_v14
          chmod +x AllocatorProbe_v14.app/AllocatorProbe_v14
          cp campaigns/s159_apple/agxfire_v14.html AllocatorProbe_v14.app/agxfire_v14.html
          sed 's/AllocatorProbe_v6/AllocatorProbe_v14/g; s/<string>6\.0<\/string>/<string>14.0<\/string>/g' \
            signing/Info.plist > AllocatorProbe_v14.app/Info.plist
          echo "$MOBILEPROVISION_BASE64" | base64 -d > AllocatorProbe_v14.app/embedded.mobileprovision
          codesign -f -s "iPhone Developer: bestai.04.a@gmail.com (4B5SHD444M)" \
            --entitlements signing/entitlements.plist \
            AllocatorProbe_v14.app
          codesign --verify AllocatorProbe_v14.app && echo "Signature valid"
          mkdir -p Payload
          cp -r AllocatorProbe_v14.app Payload/
          zip -r AllocatorProbe_v14_signed.ipa Payload/
          ls -la AllocatorProbe_v14_signed.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v14_signed
          path: AllocatorProbe_v14_signed.ipa

