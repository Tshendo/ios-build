name: AllocatorProbe v17 signed
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AllocatorProbe v17
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 -fobjc-arc             -o AllocatorProbe_v17 campaigns/s159_apple/heap_fengshui_v17.m             -isysroot "$SDK"             -framework UIKit -framework WebKit -framework Foundation
          file AllocatorProbe_v17
          shasum -a 256 AllocatorProbe_v17
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v17_bin
          path: AllocatorProbe_v17

  sign-and-package:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AllocatorProbe_v17_bin
      - name: Import certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
      - name: Package and sign
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p AllocatorProbe_v17.app
          cp AllocatorProbe_v17 AllocatorProbe_v17.app/AllocatorProbe_v17
          chmod +x AllocatorProbe_v17.app/AllocatorProbe_v17
          cp campaigns/s159_apple/agxfire_v17.html AllocatorProbe_v17.app/agxfire_v17.html
          sed 's/AllocatorProbe_v6/AllocatorProbe_v17/g; s/<string>6\.0<\/string>/<string>17.0<\/string>/g'             signing/Info.plist > AllocatorProbe_v17.app/Info.plist
          echo "$MOBILEPROVISION_BASE64" | base64 -d > AllocatorProbe_v17.app/embedded.mobileprovision
          codesign -f -s "iPhone Developer: bestai.04.a@gmail.com (4B5SHD444M)"             --entitlements signing/entitlements.plist             AllocatorProbe_v17.app
          codesign --verify AllocatorProbe_v17.app && echo "Signature valid"
          mkdir -p Payload
          cp -r AllocatorProbe_v17.app Payload/
          zip -r AllocatorProbe_v17_signed.ipa Payload/
          ls -la AllocatorProbe_v17_signed.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v17_signed
          path: AllocatorProbe_v17_signed.ipa
