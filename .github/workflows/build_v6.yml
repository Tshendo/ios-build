name: AllocatorProbe v6 signed
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AllocatorProbe v6
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2             -o AllocatorProbe_v6 campaigns/s159_apple/heap_fengshui_v6.c             -isysroot "$SDK" -framework CoreFoundation
          file AllocatorProbe_v6
      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v6_bin
          path: AllocatorProbe_v6

  sign-and-package:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: AllocatorProbe_v6_bin

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 -d > /tmp/signing.p12
          security create-keychain -p "kp" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "kp" build.keychain
          security import /tmp/signing.p12 -k build.keychain -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "kp" build.keychain
          security find-identity -v build.keychain | grep iPhone

      - name: Package and sign
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p AllocatorProbe_v6.app
          cp AllocatorProbe_v6 AllocatorProbe_v6.app/AllocatorProbe_v6
          chmod +x AllocatorProbe_v6.app/AllocatorProbe_v6

          cat > AllocatorProbe_v6.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>AllocatorProbe_v6</string>
            <key>CFBundleIdentifier</key><string>com.nexus.fengshui3.TMAQ26273N.TMAQ26273N</string>
            <key>CFBundleVersion</key><string>6.0</string>
            <key>CFBundleShortVersionString</key><string>6.0</string>
            <key>CFBundleName</key><string>AllocatorProbe_v6</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
          </dict></plist>
          PLIST

          echo "$MOBILEPROVISION_BASE64" | base64 -d > AllocatorProbe_v6.app/embedded.mobileprovision

          cat > entitlements.plist << 'ENT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>TMAQ26273N.com.nexus.fengshui3.TMAQ26273N.TMAQ26273N</string>
            <key>keychain-access-groups</key><array><string>TMAQ26273N.*</string></array>
            <key>get-task-allow</key><true/>
            <key>com.apple.developer.team-identifier</key><string>TMAQ26273N</string>
          </dict></plist>
          ENT

          codesign -f -s "iPhone Developer: bestai.04.a@gmail.com (4B5SHD444M)"             --keychain build.keychain             --entitlements entitlements.plist             AllocatorProbe_v6.app

          codesign --verify AllocatorProbe_v6.app && echo "Signature valid"
          codesign -dvvv AllocatorProbe_v6.app 2>&1 | head -20

          mkdir -p Payload
          cp -r AllocatorProbe_v6.app Payload/
          zip -r AllocatorProbe_v6_signed.ipa Payload/
          ls -la AllocatorProbe_v6_signed.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AllocatorProbe_v6_signed
          path: AllocatorProbe_v6_signed.ipa
