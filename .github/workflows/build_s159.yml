name: s159 darksword_v7 + agx_controlled_write
on: [push]

jobs:
  darksword_v7:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DarkSword v7 (per-socket markers, controlled write detection)
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
            -o DarkSword_v7 campaigns/s159_apple/darksword_v7.c \
            -isysroot "$SDK" \
            -framework CoreFoundation -framework Foundation
          file DarkSword_v7
          ls -la DarkSword_v7
          echo "Build hash: $(shasum -a 256 DarkSword_v7 | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: darksword-v7
          path: DarkSword_v7

  package_darksword_v7:
    runs-on: macos-latest
    needs: darksword_v7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: darksword-v7
      - name: Package DarkSword v7 as .app and sign with ldid
        run: |
          # Build .app bundle
          mkdir -p DarkSword_v7.app
          cp DarkSword_v7 DarkSword_v7.app/DarkSword_v7

          # Create Info.plist
          cat > DarkSword_v7.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>DarkSword_v7</string>
            <key>CFBundleIdentifier</key><string>com.nexus.darksword.v7.TMAQ26273N</string>
            <key>CFBundleVersion</key><string>7.0</string>
            <key>CFBundleShortVersionString</key><string>7.0</string>
            <key>CFBundleName</key><string>DarkSword_v7</string>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>LSApplicationCategoryType</key><string></string>
          </dict></plist>
          EOF

          # Sign with adhoc codesign (accepted by iOS Developer Mode + MDM supervised)
          codesign -f -s - DarkSword_v7.app/DarkSword_v7
          echo "codesign adhoc: $?"
          codesign -dv DarkSword_v7.app/DarkSword_v7 2>&1 | head -5

          # Package as IPA
          mkdir -p Payload
          cp -r DarkSword_v7.app Payload/
          zip -r DarkSword_v7.ipa Payload/
          ls -la DarkSword_v7.ipa
          # Verify signature in IPA
          unzip -p DarkSword_v7.ipa Payload/DarkSword_v7.app/_CodeSignature/CodeResources | head -c 100 && echo "(signature present)"
      - uses: actions/upload-artifact@v4
        with:
          name: darksword-v7-ipa
          path: DarkSword_v7.ipa

  heap_fengshui_v2_icmp:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HeapFengShui v2 ICMPv6 variant (168B in6pcb zone spray)
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          # Use existing heap_fengshui.c as base — it already sprays ICMPv6 sockets
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
            -o HeapFengShui_icmp campaigns/s156_apple/heap_fengshui.c \
            -isysroot "$SDK" \
            -framework CoreFoundation
          file HeapFengShui_icmp
          ls -la HeapFengShui_icmp
      - uses: actions/upload-artifact@v4
        with:
          name: heap-fengshui-icmp
          path: HeapFengShui_icmp

  heap_fengshui_v4:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HeapFengShui v4 (survive + kobject readback, no crash)
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
            -o HeapFengShui_v4 campaigns/s159_apple/heap_fengshui_v4.c \
            -isysroot "$SDK" \
            -framework CoreFoundation
          file HeapFengShui_v4
          ls -la HeapFengShui_v4
          echo "Build hash: $(shasum -a 256 HeapFengShui_v4 | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: heap-fengshui-v4
          path: HeapFengShui_v4

  package_fengshui_v4:
    runs-on: macos-latest
    needs: heap_fengshui_v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: heap-fengshui-v4
      - name: Package HeapFengShui v4 as IPA (adhoc signed for Sideloadly re-sign)
        run: |
          # Build .app bundle
          mkdir -p HeapFengShui_v4.app
          cp HeapFengShui_v4 HeapFengShui_v4.app/HeapFengShui_v4
          chmod +x HeapFengShui_v4.app/HeapFengShui_v4

          # Info.plist — use same team prefix as v3 (re-signed by Sideloadly/AltStore)
          cat > HeapFengShui_v4.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>HeapFengShui_v4</string>
            <key>CFBundleIdentifier</key><string>com.nexus.heapfengshui.v4</string>
            <key>CFBundleVersion</key><string>4.0</string>
            <key>CFBundleShortVersionString</key><string>4.0</string>
            <key>CFBundleName</key><string>HeapFengShui_v4</string>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>LSApplicationCategoryType</key><string></string>
          </dict></plist>
          EOF

          # Adhoc sign (Sideloadly will re-sign with real cert)
          codesign -f -s - HeapFengShui_v4.app/HeapFengShui_v4
          echo "adhoc codesign: $?"

          # Package as IPA
          mkdir -p Payload
          cp -r HeapFengShui_v4.app Payload/
          zip -r HeapFengShui_v4_unsigned.ipa Payload/
          ls -la HeapFengShui_v4_unsigned.ipa
          echo "IPA ready for Sideloadly re-sign with team 4B5SHD444M"
      - uses: actions/upload-artifact@v4
        with:
          name: heap-fengshui-v4-ipa
          path: HeapFengShui_v4_unsigned.ipa

  heap_fengshui_v5:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HeapFengShui v5 (pthread probe, LIMITS_INFO detection, CFRunLoop-free)
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
            -o HeapFengShui_v5 campaigns/s159_apple/heap_fengshui_v5.c \
            -isysroot "$SDK"
          file HeapFengShui_v5
          ls -la HeapFengShui_v5
          echo "Build hash: $(shasum -a 256 HeapFengShui_v5 | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: heap-fengshui-v5
          path: HeapFengShui_v5

  package_fengshui_v5:
    runs-on: macos-latest
    needs: heap_fengshui_v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: heap-fengshui-v5
      - name: Package HeapFengShui v5 as IPA (same bundle ID as v4 for Sideloadly replace)
        run: |
          mkdir -p HeapFengShui_v4.app
          cp HeapFengShui_v5 HeapFengShui_v4.app/HeapFengShui_v5
          chmod +x HeapFengShui_v4.app/HeapFengShui_v5

          cat > HeapFengShui_v4.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>HeapFengShui_v5</string>
            <key>CFBundleIdentifier</key><string>com.nexus.fengshui4.TMAQ26273N</string>
            <key>CFBundleVersion</key><string>5.0</string>
            <key>CFBundleShortVersionString</key><string>5.0</string>
            <key>CFBundleName</key><string>HeapFengShui_v4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>LSApplicationCategoryType</key><string></string>
          </dict></plist>
          EOF

          codesign -f -s - HeapFengShui_v4.app/HeapFengShui_v5
          echo "adhoc codesign: $?"

          mkdir -p Payload
          cp -r HeapFengShui_v4.app Payload/
          zip -r HeapFengShui_v5_sideloadly.ipa Payload/
          ls -la HeapFengShui_v5_sideloadly.ipa
          echo "IPA ready — Sideloadly re-signs with team TMAQ26273N"
          echo "After install: bundle=com.nexus.fengshui4.TMAQ26273N.TMAQ26273N"
      - uses: actions/upload-artifact@v4
        with:
          name: heap-fengshui-v5-ipa
          path: HeapFengShui_v5_sideloadly.ipa

  check_existing:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing s158 artifacts
        run: |
          echo "=== s158 artifacts ==="
          ls -la campaigns/s158_apple/*.c campaigns/s158_apple/*.m 2>/dev/null || echo "no C/M files"
          echo "=== s159 artifacts ==="
          ls -la campaigns/s159_apple/*.c campaigns/s159_apple/*.js 2>/dev/null || echo "no new files"
          echo "=== Kernel info ==="
          echo "Target: iPhone18,2 iOS 26.3.1 beta (23D8133) A19 Pro T8150"
          echo "Kernel base (from panic): 0xfffffe004d928000 slide=0x46924000"
          echo "AGX zone (primary): kalloc.icmp6pcb = 168B in6pcb"
          echo "AGX zone (F-73 hit): kalloc.192 = ipc_port zone"
          echo "v4 shader: io_bits=0x80000002 (IKOT_TASK), ip_kobject=kernel_base"
