name: IOSurface UAF PoC build
on: [push]

jobs:
  build_uaf:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IOSurface race PoC
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 -fobjc-arc \
            -o App campaigns/s242_apple/iogpu_surface_uaf.m \
            -isysroot "$SDK" \
            -framework UIKit -framework WebKit -framework Foundation \
            -framework Metal -framework IOSurface
          file App
          ls -la App
          echo "Build hash: $(shasum -a 256 App | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: game-binary
          path: App

  package_uaf:
    runs-on: macos-latest
    needs: build_uaf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game-binary
      - name: Package as adhoc IPA
        run: |
          mkdir -p App.app
          cp App App.app/App
          chmod +x App.app/App

          cat > App.app/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>App</string>
            <key>CFBundleIdentifier</key><string>com.nexus.layout_manipulation3</string>
            <key>CFBundleVersion</key><string>19.0</string>
            <key>CFBundleShortVersionString</key><string>19.0</string>
            <key>CFBundleName</key><string>AllocatorProbe_v19</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>LSApplicationCategoryType</key><string></string>
          </dict></plist>
          EOF

          codesign -f -s - App.app/App
          echo "adhoc codesign: $?"

          mkdir -p Payload
          cp -r App.app Payload/
          zip -r IOSurface_UAF_adhoc.ipa Payload/
          ls -la IOSurface_UAF_adhoc.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: IOSurface_UAF_adhoc.ipa
