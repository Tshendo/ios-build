name: s157 heap_fengshui_v2 + metal_tlb_race_v2
on: [push]
jobs:
  fengshui_v2:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 \
            -o HeapFengShui_v2 campaigns/s157_apple/heap_fengshui_v2.c \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -framework CoreFoundation
          file HeapFengShui_v2
          ls -la HeapFengShui_v2
      - uses: actions/upload-artifact@v4
        with:
          name: heap-fengshui-v2
          path: HeapFengShui_v2

  metal_race_v2:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 -fobjc-arc \
            -o MetalTLBRace_v2 campaigns/s157_apple/metal_tlb_race_v2.m \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -framework CoreFoundation -framework Metal \
            -framework IOSurface -framework Foundation
          file MetalTLBRace_v2
          ls -la MetalTLBRace_v2
      - uses: actions/upload-artifact@v4
        with:
          name: metal-tlb-race-v2
          path: MetalTLBRace_v2
