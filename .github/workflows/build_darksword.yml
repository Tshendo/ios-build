name: Build JPEG UAF
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd ios-app
          xcodebuild -project Test.xcodeproj -scheme Test \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO ARCHS=arm64 VALID_ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 build 2>&1 | tail -20
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Test.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p /tmp/Payload && cp -r "$APP" /tmp/Payload/
            cd /tmp && zip -r $GITHUB_WORKSPACE/JpegUAF.ipa Payload/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jpeg-uaf
          path: JpegUAF.ipa
          if-no-files-found: warn
