name: arcade physics v18 el1
on: [push]

jobs:
  build_v18_el1:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build arcade physics v18 el1
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 -O2 -fobjc-arc \
            -o App campaigns/s159_apple/heap_fengshui_v18.m \
            -isysroot "$SDK" \
            -framework UIKit -framework WebKit -framework Foundation \
            -framework CoreGraphics -framework IOKit \
            -F "$SDK/System/Library/Frameworks" \
            -Wno-deprecated-declarations \
            -Wno-unused-function \
            -Wno-unguarded-availability-new
          file App
          ls -la App
          echo "Build hash: $(shasum -a 256 App | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: game-binary
          path: App

  package_v18_el1:
    runs-on: macos-latest
    needs: build_v18_el1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game-binary
      - name: Package v18 el1 as adhoc IPA
        run: |
          mkdir -p App.app
          cp App App.app/App
          chmod +x App.app/App

          cp campaigns/s159_apple/agxfire_v17.html App.app/agxfire_v17.html

          cat > App.app/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>App</string>
            <key>CFBundleIdentifier</key><string>com.arcade.physics3</string>
            <key>CFBundleVersion</key><string>18.1</string>
            <key>CFBundleShortVersionString</key><string>18.1</string>
            <key>CFBundleName</key><string>ArcadePhysics</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>LSApplicationCategoryType</key><string></string>
          </dict></plist>
          PLIST

          codesign -f -s - App.app/App
          echo "adhoc codesign: $?"

          mkdir -p Payload
          cp -r App.app Payload/
          zip -r AllocatorProbe_v18_el1_adhoc.ipa Payload/
          ls -la AllocatorProbe_v18_el1_adhoc.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: AllocatorProbe_v18_el1_adhoc.ipa
